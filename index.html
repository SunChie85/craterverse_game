<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050812">
  <title>Craterverse — Flight Deck</title>
  <style>
    html,body{height:100%;margin:0;background:#050812;color:#79dfe7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .boot{height:100%;display:grid;place-items:center;letter-spacing:.18em;font-size:11px}
    .boot:after{content:"";display:inline-block;width:6px;height:6px;margin-left:10px;border-radius:50%;background:#79dfe7;animation:p 1.2s infinite}
    @keyframes p{50%{opacity:.2}}
  </style>
</head>
<body>
  <div class="boot">CHECKING STATION STATUS</div>
  <script>
  (()=>{
    const PUBLIC_GAME_HOST='play.craterverse.xyz';
    const OFFLINE_URL='https://craterverse.xyz/offline';
    const isPublicGameHost=location.hostname.toLowerCase()===PUBLIC_GAME_HOST;

    async function boot(){
      // IMPORTANT: maintenance only blocks the public custom domain.
      // The Vercel production URL remains a test/admin access path.
      if(!isPublicGameHost){
        location.replace('/game');
        return;
      }

      let cfg={enabled:false,redirect:OFFLINE_URL};
      try{
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),2200);
        const r=await fetch('/maintenance.json?ts='+Date.now(),{
          cache:'no-store',
          signal:controller.signal,
          headers:{'Cache-Control':'no-cache'}
        });
        clearTimeout(timer);
        if(r.ok){
          const remote=await r.json();
          cfg={...cfg,...remote};
        }
      }catch(err){
        // Fail open: if the maintenance config cannot be read, don't lock players out.
        console.warn('[maintenance] status check failed; continuing to game',err);
      }

      if(cfg.enabled===true){
        location.replace(cfg.redirect||OFFLINE_URL);
        return;
      }
      location.replace('/game');
    }

    boot();
  })();
  </script>
</body>
</html>
